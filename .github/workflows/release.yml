name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip debug symbols (Unix)
        if: matrix.os != 'windows-latest' && matrix.use_cross != true
        shell: bash
        run: strip target/${{ matrix.target }}/release/gateway-core || true

      - name: Prepare packaging directory
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/gateway-core"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/gateway-core.exe"
          fi
          cp "$BIN_PATH" dist/
          cp config.example.yaml dist/
          cp README.md dist/
          cp LICENSE dist/

      - name: Create archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME="gateway-core-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C dist .
          shasum -a 256 "$ARCHIVE_NAME" > "gateway-core-${{ matrix.target }}.sha256"

      - name: Create archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ArchiveName = "gateway-core-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/* -DestinationPath $ArchiveName
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Set-Content "gateway-core-${{ matrix.target }}.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gateway-core-${{ matrix.target }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
